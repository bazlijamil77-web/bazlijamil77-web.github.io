<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohammad Bazli Bin Jamil</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9ecef;
    font-family: Arial, Helvetica, sans-serif;
    padding: 25px;
}

.card {
    width: min(900px, 100%);
    aspect-ratio: 1.7 / 1;
    background: linear-gradient(135deg, #ffffff 0%, #f5f7f9 100%);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.18);
    padding: 45px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 9px;
    height: 100%;
    background: #005a9c;
}

.company {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #005a9c;
    text-transform: uppercase;
}

.name {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 700;
    color: #17212b;
    margin-top: 35px;
    letter-spacing: 0.5px;
}

.position {
    font-size: clamp(16px, 2.5vw, 22px);
    color: #4b5563;
    margin-top: 8px;
}

.department {
    font-size: clamp(14px, 2vw, 18px);
    color: #68717c;
    margin-top: 8px;
    line-height: 1.5;
}

.divider {
    height: 1px;
    background: #d5dbe0;
    margin: 25px 0 20px;
}

.contact {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 30px;
    font-size: 15px;
    color: #374151;
}

.contact a {
    color: #374151;
    text-decoration: none;
}

.save {
    position: absolute;
    right: 35px;
    bottom: 30px;
    padding: 12px 20px;
    border-radius: 30px;
    background: #005a9c;
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .card {
        aspect-ratio: auto;
        min-height: 430px;
        padding: 30px;
        border-radius: 16px;
    }

    .name {
        margin-top: 45px;
    }

    .save {
        position: static;
        text-align: center;
        margin-top: 25px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div>
        <div class="company">
            Bintulu Port Holdings Berhad
        </div>

        <div class="name">
            Mohammad Bazli<br>
            Bin Jamil
        </div>

        <div class="position">
            Executive, Cash Management
        </div>

        <div class="department">
            Treasury, Corporate Finance & Investor Relations<br>
            Group Finance Division
        </div>
    </div>

    <div>
        <div class="divider"></div>

        <div class="contact">
            <span>📞 Your Phone</span>
            <span>✉ Your Email</span>
            <span>in LinkedIn</span>
        </div>

        <a class="save" href="#">
            + Save Contact
        </a>
    </div>

</div>

</body>
</html>
